{{- if .Values.externalSecret.enabled }}
{{- if and .Values.secret.enabled (eq (include "shipform.secretName" .) (include "shipform.externalSecretTargetName" .)) }}
{{- fail (printf "secret and externalSecret both manage Secret %q; set externalSecret.target.name or secret.name to different names, or enable only one" (include "shipform.secretName" .)) }}
{{- end }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "shipform.fullname" . }}
  labels:
    {{- include "shipform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ default "ClusterSecretStore" .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "shipform.externalSecretTargetName" . }}
    creationPolicy: {{ default "Owner" .Values.externalSecret.target.creationPolicy }}
  {{- with .Values.externalSecret.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

