{{- if and .Values.tests.enabled .Values.service.enabled (or (eq .Values.workload.type "Deployment") (eq .Values.workload.type "StatefulSet")) }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "shipform.fullname" . }}-test-connection"
  # Not the workload's selector labels: the test pod must not join the
  # Service, NetworkPolicy, or PodDisruptionBudget of the application.
  labels:
    helm.sh/chart: {{ include "shipform.chart" . }}
    app.kubernetes.io/name: {{ printf "%s-test" (include "shipform.name" . | trunc 58 | trimSuffix "-") }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - wget
      args:
        - "-qO-"
        - "{{ include "shipform.fullname" . }}:{{ (index .Values.service.ports 0).port }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
{{- end }}
