{{- if .Values.verticalPodAutoscaler.enabled }}
{{- $vpa := .Values.verticalPodAutoscaler }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "shipform.fullname" . }}
  labels:
    {{- include "shipform.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: {{ .Values.workload.type }}
    name: {{ include "shipform.fullname" . }}
  updatePolicy:
    updateMode: {{ $vpa.updateMode | quote }}
    {{- if not (kindIs "invalid" $vpa.minReplicas) }}
    minReplicas: {{ $vpa.minReplicas }}
    {{- end }}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources:
          {{- toYaml $vpa.controlledResources | nindent 10 }}
        controlledValues: {{ $vpa.controlledValues }}
        {{- with $vpa.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
