{{- if and .Values.podDisruptionBudget.enabled (or (eq .Values.workload.type "Deployment") (eq .Values.workload.type "StatefulSet")) }}
{{- $min := .Values.podDisruptionBudget.minAvailable }}
{{- $max := .Values.podDisruptionBudget.maxUnavailable }}
{{- $hasMin := not (or (kindIs "invalid" $min) (eq (toString $min) "")) }}
{{- $hasMax := not (or (kindIs "invalid" $max) (eq (toString $max) "")) }}
{{- if and $hasMin $hasMax }}
{{- fail "Set only one of podDisruptionBudget.minAvailable or podDisruptionBudget.maxUnavailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shipform.fullname" . }}
  labels:
    {{- include "shipform.labels" . | nindent 4 }}
spec:
  {{- if $hasMax }}
  maxUnavailable: {{ $max }}
  {{- else }}
  # minAvailable defaults to 1 when neither field is set.
  minAvailable: {{ ternary $min 1 $hasMin }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shipform.selectorLabels" . | nindent 6 }}
{{- end }}
