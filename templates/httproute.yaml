{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shipform.fullname" . }}
  labels:
    {{- include "shipform.labelsWith" (dict "root" . "extra" .Values.httpRoute.labels) | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- include "shipform.routeRules" (dict "root" . "rules" .Values.httpRoute.rules "default" "http") | nindent 4 }}
{{- end }}
