{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shipform.fullname" . }}
  labels:
    {{- include "shipform.labelsWith" (dict "root" . "extra" .Values.networkPolicy.labels) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shipform.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $egress := .Values.networkPolicy.egress | default list }}
  {{- $allowDNS := .Values.networkPolicy.allowDNS }}
  {{- if and $allowDNS.enabled (has "Egress" .Values.networkPolicy.policyTypes) }}
  {{- if not $allowDNS.to }}
  {{- fail "networkPolicy.allowDNS.to must list at least one peer when allowDNS.enabled is true" }}
  {{- end }}
  {{- $dnsPorts := list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP") }}
  {{- $egress = prepend $egress (dict "to" $allowDNS.to "ports" $dnsPorts) }}
  {{- end }}
  {{- with $egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

