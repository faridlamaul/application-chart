nameOverride: gateway-api

image:
  repository: ghcr.io/example/gateway-api
  tag: "1.0.0"

httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      timeouts:
        request: 30s
      servicePort: http
