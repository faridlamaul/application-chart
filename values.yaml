# Default values for shipform.
# This file is intentionally generic. Do not commit real secrets here.

nameOverride: ""
fullnameOverride: ""

workload:
  # Supported values: Deployment, StatefulSet, Job, CronJob
  type: Deployment

replicaCount: 2
revisionHistoryLimit: 10

image:
  # Runs as a non-root user (uid 101) and listens on 8080, matching the default
  # containerPorts and podSecurityContext.runAsNonRoot.
  repository: nginxinc/nginx-unprivileged
  tag: "1.27"
  pullPolicy: IfNotPresent

imagePullSecrets: []

command: []
args: []

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

env: []
envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
startupProbe:
  enabled: false

lifecycle: {}

podAnnotations: {}
podLabels: {}
annotations: {}
labels: {}
# Values for the app.kubernetes.io/component and app.kubernetes.io/part-of
# labels; default to "application" and the chart name.
component: ""
partOf: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# An emptyDir mounted at /tmp so applications can write temporary files under
# the read-only root filesystem. Skipped when volumeMounts already mounts /tmp.
# Set medium to Memory for a tmpfs; its usage counts against the memory limit.
tmpDir:
  enabled: true
  sizeLimit: 64Mi
  medium: ""

# Kubernetes injects one set of environment variables per Service in the
# namespace when this is true. Use DNS names instead.
enableServiceLinks: false

serviceAccount:
  create: true
  # Set on the ServiceAccount and on the pod. Must be true for rbac rules to be
  # usable from the pod.
  automount: false
  annotations: {}
  name: ""

rbac:
  create: false
  rules: []

service:
  enabled: true
  type: ClusterIP
  headless: false
  annotations: {}
  labels: {}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None
  sessionAffinityConfig: {}
  internalTrafficPolicy: ""
  externalTrafficPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
  tls: []

configMap:
  enabled: false
  name: ""
  annotations: {}
  labels: {}
  data: {}

secret:
  enabled: false
  name: ""
  annotations: {}
  labels: {}
  type: Opaque
  data: {}
  stringData: {}

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: default-secret-store
    kind: ClusterSecretStore
  target:
    name: ""
    creationPolicy: Owner
  data: []
  dataFrom: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

podDisruptionBudget:
  enabled: false
  # Set one of the two; minAvailable defaults to 1 when both are null.
  minAvailable: null
  maxUnavailable: null

networkPolicy:
  enabled: false
  labels: {}
  policyTypes:
    - Ingress
  # Prepends an egress rule allowing port 53 (UDP and TCP) to the peers in
  # `to`. Rendered only when policyTypes contains Egress.
  allowDNS:
    enabled: true
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  scheme: http
  relabelings: []
  metricRelabelings: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 25%

statefulSet:
  serviceName: ""
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy: {}
  volumeClaimTemplates: []

terminationGracePeriodSeconds: 30
priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

volumes: []
volumeMounts: []
initContainers: []
extraContainers: []

# Used when workload.type is Job. The Job runs as a Helm post-install and
# post-upgrade hook, so `helm install`/`upgrade` waits for it (see --timeout)
# and every upgrade runs it again. Probes are not applied to batch containers.
job:
  annotations: {}
  labels: {}
  backoffLimit: 6
  activeDeadlineSeconds: null
  ttlSecondsAfterFinished: 300
  restartPolicy: Never
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

# Used when workload.type is CronJob. Probes are not applied to batch containers.
cronjob:
  annotations: {}
  labels: {}
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: null
  suspend: false
  backoffLimit: 6
  restartPolicy: OnFailure
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

tests:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
