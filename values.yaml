# Default values for shipform.
# This file is intentionally generic. Do not commit real secrets here.

nameOverride: ""
fullnameOverride: ""

workload:
  # Supported values: Deployment, StatefulSet, Job, CronJob
  type: Deployment

replicaCount: 2
revisionHistoryLimit: 10

image:
  # Runs as a non-root user (uid 101) and listens on 8080, matching the default
  # containerPorts and podSecurityContext.runAsNonRoot.
  repository: nginxinc/nginx-unprivileged
  tag: "1.27"
  pullPolicy: IfNotPresent

imagePullSecrets: []

command: []
args: []

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

env: []
envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
startupProbe:
  enabled: false

lifecycle: {}

podAnnotations: {}
podLabels: {}
annotations: {}
labels: {}
# Values for the app.kubernetes.io/component and app.kubernetes.io/part-of
# labels; default to "application" and the chart name.
component: ""
partOf: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# An emptyDir mounted at /tmp so applications can write temporary files under
# the read-only root filesystem. Skipped when volumeMounts already mounts /tmp.
# Set medium to Memory for a tmpfs; its usage counts against the memory limit.
tmpDir:
  enabled: true
  sizeLimit: 64Mi
  medium: ""

# A standalone PersistentVolumeClaim mounted in the main container. Not
# supported for workload.type StatefulSet (use statefulSet.volumeClaimTemplates).
# ReadWriteOnce with more than one replica, or with RollingUpdate, can leave new
# pods pending. The chart-created claim is kept on uninstall when keep is true.
persistence:
  enabled: false
  existingClaim: ""
  storageClassName: null # null: cluster default; "": no class
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data
  subPath: ""
  annotations: {}
  keep: true

# Kubernetes injects one set of environment variables per Service in the
# namespace when this is true. Use DNS names instead.
enableServiceLinks: false

serviceAccount:
  create: true
  # Set on the ServiceAccount and on the pod. Must be true for rbac rules to be
  # usable from the pod.
  automount: false
  annotations: {}
  name: ""

rbac:
  create: false
  rules: []

service:
  enabled: true
  type: ClusterIP
  headless: false
  annotations: {}
  labels: {}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None
  sessionAffinityConfig: {}
  internalTrafficPolicy: ""
  externalTrafficPolicy: ""

httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters: []
      timeouts: {}
      servicePort: http

grpcRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches: []
      filters: []
      servicePort: grpc

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
  tls: []

configMap:
  enabled: false
  name: ""
  annotations: {}
  labels: {}
  data: {}

secret:
  enabled: false
  name: ""
  annotations: {}
  labels: {}
  type: Opaque
  data: {}
  stringData: {}

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: default-secret-store
    kind: ClusterSecretStore
  target:
    name: ""
    creationPolicy: Owner
  data: []
  dataFrom: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

# KEDA ScaledObject. Requires the KEDA operator; excludes autoscaling.enabled.
keda:
  enabled: false
  annotations: {}
  minReplicaCount: 1
  maxReplicaCount: 10
  idleReplicaCount: null
  pollingInterval: 30
  cooldownPeriod: 300
  fallback: {}
  advanced: {}
  # Required (at least one) when enabled. Items are KEDA trigger objects.
  triggers: []

# VerticalPodAutoscaler. Requires the VPA CRDs. Use updateMode Off (recommend only)
# alongside autoscaling or keda.
verticalPodAutoscaler:
  enabled: false
  updateMode: "Off" # Off, Initial, Recreate, InPlaceOrRecreate, Auto
  minReplicas: null
  controlledResources: [cpu, memory]
  controlledValues: RequestsAndLimits
  minAllowed: {}
  maxAllowed: {}

podDisruptionBudget:
  enabled: false
  # Set one of the two; minAvailable defaults to 1 when both are null.
  minAvailable: null
  maxUnavailable: null

networkPolicy:
  enabled: false
  labels: {}
  policyTypes:
    - Ingress
  # Prepends an egress rule allowing port 53 (UDP and TCP) to the peers in
  # `to`. Rendered only when policyTypes contains Egress.
  allowDNS:
    enabled: true
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  scheme: http
  relabelings: []
  metricRelabelings: []

prometheusRule:
  enabled: false
  namespace: ""
  labels: {}
  annotations: {}
  groups: []                        # required (at least one group) when enabled

podMonitor:
  enabled: false                    # cannot be combined with serviceMonitor.enabled
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http                        # container port name
  scheme: http
  relabelings: []
  metricRelabelings: []

# Extra manifests: each item is a map or a string. Maps render through
# tpl (toYaml .); strings through tpl. The chart adds no labels.
extraObjects: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 25%

statefulSet:
  serviceName: ""
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy: {}
  volumeClaimTemplates: []

terminationGracePeriodSeconds: 30
priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

volumes: []
volumeMounts: []
initContainers: []
extraContainers: []

# Used when workload.type is Job. The Job runs as a Helm post-install and
# post-upgrade hook, so `helm install`/`upgrade` waits for it (see --timeout)
# and every upgrade runs it again. Probes are not applied to batch containers.
job:
  annotations: {}
  labels: {}
  backoffLimit: 6
  activeDeadlineSeconds: null
  ttlSecondsAfterFinished: 300
  restartPolicy: Never
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

# Used when workload.type is CronJob. Probes are not applied to batch containers.
cronjob:
  annotations: {}
  labels: {}
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: null
  suspend: false
  backoffLimit: 6
  restartPolicy: OnFailure
  command: []
  args: []
  env: []
  envFrom: []
  resources: {}

# Companion Jobs, rendered next to the main workload. Each key names one Job,
# <fullname>-<key>; keys match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ and the name
# must fit in 63 characters. A companion inherits the root image, imagePullSecrets,
# env, envFrom, volumes, volumeMounts, podSecurityContext, securityContext,
# nodeSelector, tolerations, affinity and tmpDir. It does not get command, args,
# resources, probes, lifecycle, containerPorts, initContainers, extraContainers,
# persistence, priorityClassName, runtimeClassName, topologySpreadConstraints or
# terminationGracePeriodSeconds; set command, args and resources on the entry.
# Its pods carry app.kubernetes.io/name: <name>-<key>, so the main Service,
# PodDisruptionBudget and NetworkPolicy do not select them.
# A hook that includes pre-install runs before the chart's ConfigMap, Secret,
# ExternalSecret and ServiceAccount exist: reference existing Secrets, and it
# runs as the "default" ServiceAccount unless serviceAccountName is set.
# Every companion Job is a Helm hook, because a Job's pod template is immutable;
# an empty hook means post-install,post-upgrade.
jobs: {}
#  migrate:
#    enabled: true
#    hook: pre-install,pre-upgrade   # empty: post-install,post-upgrade
#    hookWeight: "0"
#    hookDeletePolicy: before-hook-creation,hook-succeeded
#    serviceAccountName: ""          # empty: see above
#    image: {}                       # empty: .Values.image; else repository and tag
#    command: []                     # empty: the image entrypoint
#    args: []                        # empty: the image's default arguments
#    env: []                         # appended to .Values.env
#    envFrom: []                     # appended to .Values.envFrom
#    resources: {}                   # empty: none
#    securityContext: {}             # empty: .Values.securityContext; else replaces it
#    backoffLimit: 3
#    activeDeadlineSeconds: null
#    ttlSecondsAfterFinished: 300
#    restartPolicy: Never
#    annotations: {}
#    labels: {}
#    podAnnotations: {}

# Companion CronJobs. Same rules as jobs, except the name must fit in 52
# characters (the controller appends a suffix to each Job) and there are no
# hooks.
cronJobs: {}
#  cleanup:
#    enabled: true
#    schedule: "0 3 * * *"
#    timeZone: ""                    # e.g. Asia/Jakarta; empty: the controller's zone
#    concurrencyPolicy: Forbid
#    suspend: false
#    successfulJobsHistoryLimit: 3
#    failedJobsHistoryLimit: 1
#    startingDeadlineSeconds: null
#    (plus every jobs field except hook, hookWeight and hookDeletePolicy)

tests:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
